<div class="container mt-4">
  <h2 class="text-primary mb-3">Gestión de Usuarios</h2>

  <!-- Alertas -->
  <div *ngIf="mensajeError" class="alert alert-danger py-2 fw-bold">{{ mensajeError }}</div>

  <!-- Formulario de Crear / Editar -->
  <div class="card p-3 mb-4 border-secondary bg-light">
    <h5>{{ modoEdicion ? 'Editar Usuario' : 'Registrar Nuevo Usuario' }}</h5>
    <div class="row g-2">
      <div class="col-md-3">
        <input type="text" class="form-control" placeholder="Nombre Completo" [(ngModel)]="nuevoUsuario.nombre">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" placeholder="Username" [(ngModel)]="nuevoUsuario.username">
      </div>
      <div class="col-md-3">
        <input type="email" class="form-control" placeholder="Email" [(ngModel)]="nuevoUsuario.email">
      </div>
      <!-- Ocultar campo de contraseña si estamos editando -->
      <div class="col-md-2" *ngIf="!modoEdicion">
        <input type="password" class="form-control" placeholder="Contraseña" [(ngModel)]="nuevoUsuario.password">
      </div>
      <div class="col-md-2">
        <select class="form-select" [(ngModel)]="nuevoUsuario.rol">
          <option value="LECTOR">Lector</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>
    </div>
    <div class="mt-2 d-flex gap-2">
      <button class="btn btn-success" (click)="guardarUsuario()">{{ modoEdicion ? 'Actualizar' : 'Guardar' }}</button>
      <button *ngIf="modoEdicion" class="btn btn-secondary" (click)="limpiarFormulario()">Cancelar</button>
    </div>
  </div>

  <!-- Tabla de Usuarios (La misma que ya teníamos lista) -->
  <table class="table table-bordered table-striped align-middle">
    <thead class="table-dark">
      <tr>
        <th>Nombre</th>
        <th>Username / Rol</th>
        <th>En Poder</th>
        <th>Historial</th>
        <th class="text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of usuariosConEstadisticas">
        <td class="fw-bold">{{ u.nombre }}</td>
        <td>{{ u.username }} <br> <span class="badge bg-info text-dark">{{ u.rol }}</span></td>
        <td>
          <span class="badge fs-6" [ngClass]="u.activos > 0 ? 'bg-danger' : 'bg-secondary'">
            {{ u.activos }} activos
          </span>
        </td>
        <td>
          <span class="badge bg-success fs-6">{{ u.devueltos }} devueltos</span>
        </td>
        <td class="text-center">
          <button class="btn btn-sm btn-warning fw-bold me-1" (click)="editar(u)">Editar</button>
          <button class="btn btn-sm fw-bold" 
                  [ngClass]="u.activos > 0 ? 'btn-secondary' : 'btn-danger'" 
                  [disabled]="u.activos > 0"
                  (click)="eliminar(u)">
            Eliminar
          </button>
        </td>
      </tr>
      <tr *ngIf="usuariosConEstadisticas.length === 0">
        <td colspan="5" class="text-center text-muted py-3">No hay usuarios registrados...</td>
      </tr>
    </tbody>
  </table>
</div>
